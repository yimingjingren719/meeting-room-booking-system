server:
  port: 8080

spring:
  application:
    name: meeting-room-booking-backend
  datasource:
    url: jdbc:h2:file:./data/meeting_room;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: meeting-room-booking-system-local-development-secret-key
    expiration-minutes: 480
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*

