spring:
  datasource:
    url: jdbc:h2:mem:meeting_room_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    clean-disabled: true
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: meeting-room-booking-system-test-secret-key
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:*

